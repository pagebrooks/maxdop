<text y="262" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="18.00" fill="#0000FF">case</tspan><tspan x="60.14" fill="#0000FF">when</tspan><tspan x="93.85" fill="#000000"> s.Revenue&gt;</tspan><tspan x="186.56" fill="#098658">100000</tspan><tspan x="245.56" fill="#0000FF">then</tspan><tspan x="287.70" fill="#A31515">'A'</tspan><tspan x="321.41" fill="#0000FF">when</tspan><tspan x="355.12" fill="#000000"> s.Revenue&gt;</tspan><tspan x="447.83" fill="#098658">50000</tspan><tspan x="498.40" fill="#0000FF">then</tspan><tspan x="540.54" fill="#A31515">'B'</tspan><tspan x="574.25" fill="#0000FF">else</tspan><tspan x="616.39" fill="#A31515">'C'</tspan><tspan x="650.10" fill="#0000FF">end</tspan><tspan x="683.81" fill="#0000FF">as</tspan><tspan x="700.67" fill="#000000"> Tier</tspan></text>
