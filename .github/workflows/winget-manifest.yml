# Proves the WinGet manifests in packaging/winget/ actually install something that runs.
#
# Everything else about those manifests can be checked on Linux — the JSON schemas are public, and
# `komac analyze` derives the installer block straight from the archive. One thing cannot: whether
# `NestedInstallerFiles.RelativeFilePath` points at the executable. Get it wrong and the package
# installs cleanly, reports success, and leaves no working command. Schema validation passes, a
# reviewer sees nothing, and the first person to find out is a user.
#
# So this installs the package from the local manifests on a real Windows machine and then runs the
# binary. It is manual, not per-push: it exists for the minutes before a submission to winget-pkgs,
# and after a release when the manifests have been pointed at new archives.
name: winget manifest

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packaging/winget/**'
      - '.github/workflows/winget-manifest.yml'

permissions:
  contents: read

jobs:
  install:
    name: Validate and install
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # winget used to need installing here: the Server 2022 image had no Store, so no App
      # Installer. windows-latest is Server 2025 now and ships winget, so the bootstrap action is
      # gone — it broke on exactly that. Its "simple setup" path runs `winget upgrade winget`, and
      # winget exits non-zero when an upgrade needs a restart to finish, so a successful upgrade
      # failed the job and skipped every check below it.
      #
      # Assert it rather than assume it, so a future image that drops winget says so plainly
      # instead of failing later with something that reads like a manifest problem.
      - name: winget is on the runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Write-Error "winget is not on this runner image; this job needs it installed again"
            exit 1
          }
          winget --version

      - name: Validate the manifests
        shell: pwsh
        run: |
          winget validate --manifest packaging\winget
          if ($LASTEXITCODE -ne 0) { throw "winget validate failed" }

      - name: Install from the local manifests
        shell: pwsh
        run: |
          # Off by default, because installing from a manifest bypasses the signed repository.
          winget settings --enable LocalManifestFiles

          winget install --manifest packaging\winget `
            --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "winget install failed with $LASTEXITCODE" }

      - name: The installed command runs
        shell: pwsh
        run: |
          # A portable package writes its shim to a links directory that is added to PATH for *new*
          # processes; this step's shell started before that happened, so PATH is refreshed by hand
          # rather than trusting inheritance.
          $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' +
                      [Environment]::GetEnvironmentVariable('PATH', 'User')

          # -join is load-bearing. `maxdop --version` prints two lines, so PowerShell captures an
          # array, and a comparison operator against an array *filters* it instead of returning a
          # boolean: `$array -notmatch 'x'` yields every element without 'x', and a non-empty array
          # is truthy. The grammar line never contains the version, so the check below would throw
          # on a perfectly good install.
          $version = (maxdop --version) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "maxdop exited $LASTEXITCODE" }
          Write-Host $version

          # The point of the whole job: not that a file landed somewhere, but that the shim WinGet
          # created resolves to a binary that runs and identifies itself as the version the manifest
          # claims to install.
          $expected = (Get-Content packaging\winget\pagebrooks.maxdop.yaml |
            Select-String -Pattern '^PackageVersion:' |
            ForEach-Object { $_.Line -replace '^PackageVersion:\s*', '' }).Trim()

          if (-not $expected) { throw "no PackageVersion in the version manifest" }

          if ($version -notmatch [regex]::Escape($expected)) {
            throw "manifest declares $expected, the installed binary reports '$version'"
          }

          Write-Host "::notice::maxdop $expected installs from the manifests and runs"

      - name: It formats SQL, not just starts
        shell: pwsh
        run: |
          $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' +
                      [Environment]::GetEnvironmentVariable('PATH', 'User')

          Set-Content -Path query.sql -Value 'select a,b from dbo.t where a=1'
          $out = (maxdop query.sql) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "maxdop exited $LASTEXITCODE" }

          if ($out -notmatch '^SELECT\b') {
            throw "expected formatted SQL, got: $out"
          }
          Write-Host "formatted: $out"

      - name: Uninstall cleanly
        if: always()
        shell: pwsh
        run: |
          # `if: always()` so a failure above still exercises this. An uninstall that leaves the shim
          # behind is a defect in the manifest too, and this is the only place it would show up.
          # --accept-source-agreements for the same reason the install needs it: winget refuses to
          # touch a machine whose msstore source agreement has not been accepted, and answers with
          # -1978335162 rather than anything about this package. Without it the teardown failed on a
          # run where the manifest was fine.
          winget uninstall --id pagebrooks.maxdop --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "winget uninstall failed with $LASTEXITCODE" }
