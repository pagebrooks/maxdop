name: Pinned Node
description: >-
  Installs the Node version pinned in mise.toml, for the same reason the .NET
  action does: the pin lives in one file so CI and a developer's
  `mise exec -- npm test` cannot drift apart.

runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: |
        set -euo pipefail
        version="$(sed -n 's/^ *node *= *"\(.*\)"/\1/p' mise.toml | head -1)"
        if [ -z "$version" ]; then
          echo "::error file=mise.toml::no node pin found — the CI Node is read from this file"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Pinned Node: $version"

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ steps.pin.outputs.version }}
